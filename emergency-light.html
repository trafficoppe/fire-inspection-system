<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; frame-src 'none'; connect-src https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>ทะเบียนโคมไฟฟ้าแสงสว่างฉุกเฉิน</title>
<link rel="stylesheet" href="emergency-light.css?v=20261124-checked1">
<script defer src="alarm-data.js"></script>
<script defer src="config.js"></script>
<script defer src="emergency-light.public-api.js?v=20261124-light-public1"></script>
<script defer src="emergency-light.demo.js?v=20261124-light-public1"></script>
<script defer src="emergency-light.pdf.js?v=20261125-asset-pdf1"></script>
<script defer src="emergency-light.js?v=20261125-asset-pdf1"></script>
</head><body><main><div class="main-card">
<header><img class="alarm-logo" src="logo.png" alt="กองกายภาพและสิ่งแวดล้อม"><h1 id="department"></h1></header>
<section id="inventory">
<h2>รายการโคมไฟฟ้าแสงสว่างฉุกเฉิน</h2><nav class="nav-actions" aria-label="การจัดการทะเบียน"><a id="list-back" class="button-link" href="index.html">‹ กลับ</a><button id="add" type="button" disabled>+ เพิ่มไฟฉุกเฉิน</button></nav><div id="inventory-notice" class="note" aria-hidden="true"></div>
<button id="inventory-retry" class="retry-inventory" type="button" hidden>ลองใหม่อีกครั้ง</button>
<div id="items"></div>
</section>
<section id="adding" hidden><h2>เพิ่มไฟฉุกเฉิน</h2>
<form id="add-form" autocomplete="off"><label for="number">ตัวที่</label><input id="number" required maxlength="40" placeholder="เช่น 1">
<label for="location">จุดติดตั้ง</label><input id="location" maxlength="200" required>
<label for="installationFloor">ชั้นที่ติดตั้ง</label><input id="installationFloor" type="text" maxlength="50" required placeholder="เช่น 1, G, B1 หรือ ภายนอกอาคาร">
<div class="form-actions"><button data-back type="button">กลับรายการ</button><button class="primary" type="submit">บันทึกรายการ</button></div></form></section>
<section id="inspecting" hidden><h2>บันทึกผลตรวจโคมไฟฟ้าแสงสว่างฉุกเฉิน</h2>
<form id="inspect-form" class="inspect-form" autocomplete="off"><label for="targetNumber">ตัวที่</label><input id="targetNumber" readonly><label for="targetLocation">จุดติดตั้ง</label><input id="targetLocation" readonly>
<label for="inspectionDate">วันที่ตรวจ</label><input id="inspectionDate" type="date" required>
<fieldset><legend>ทดสอบการทำงาน (Test)</legend><div class="inspection-choice"><div class="inspection-choice-item"><input class="inspection-radio" id="testStatus-ok" type="radio" name="testStatus" value="ปกติ" required checked><label class="inspection-option" for="testStatus-ok">ปกติ</label></div><div class="inspection-choice-item"><input class="inspection-radio" id="testStatus-fail" type="radio" name="testStatus" value="ไม่ปกติ"><label class="inspection-option not-ok" for="testStatus-fail">ไม่ปกติ</label></div></div></fieldset>
<fieldset><legend>สถานะแบตเตอรี่</legend><div class="inspection-choice"><div class="inspection-choice-item"><input class="inspection-radio" id="batteryStatus-ok" type="radio" name="batteryStatus" value="ปกติ" required checked><label class="inspection-option" for="batteryStatus-ok">ปกติ</label></div><div class="inspection-choice-item"><input class="inspection-radio" id="batteryStatus-fail" type="radio" name="batteryStatus" value="ไม่ปกติ"><label class="inspection-option not-ok" for="batteryStatus-fail">ไม่ปกติ</label></div></div></fieldset>
<div class="inspector-head"><label for="inspectorName">ผู้ตรวจสอบ</label><button id="clear-inspector" type="button" hidden>ล้างชื่อที่จำไว้</button></div><input id="inspectorName" maxlength="150" required>
<label for="inspectionNote">หมายเหตุ (ถ้ามี)</label><textarea id="inspectionNote" maxlength="2000"></textarea>
<div class="form-actions"><button data-back type="button">กลับรายการ</button><button class="inspect-save" type="submit">บันทึกผลตรวจ</button></div></form></section>
<dialog id="history" aria-labelledby="history-title"><div class="history-head"><h2 id="history-title">ประวัติไฟฉุกเฉิน <span id="history-target"></span></h2><button id="history-close" class="history-close" type="button" aria-label="ปิดประวัติ" autofocus>×</button></div><div class="history-body">
<div id="history-wait" class="history-wait" role="status" hidden><span class="history-spinner" aria-hidden="true"></span>กำลังโหลดประวัติ...</div>
<div id="history-controls" hidden class="history-controls"><label for="history-year">ปี พ.ศ.</label><select id="history-year" aria-controls="history-table"></select></div>
<div id="history-table" hidden class="history-wrap" tabindex="0" role="region" aria-label="ตารางประวัติการตรวจตามเดือน"><table class="month-table"><caption class="a11y-status">ผลตรวจล่าสุดของแต่ละเดือน</caption><thead><tr><th scope="col">ด/ป</th><th scope="col">ทดสอบ</th><th scope="col">แบตเตอรี่</th><th scope="col">สถานะ</th><th scope="col">วันที่ตรวจ</th></tr></thead><tbody id="history-rows"></tbody></table></div>
<button id="history-pdf" type="button" hidden>ดาวน์โหลด PDF</button>
<p id="history-status" role="status" aria-live="polite"></p>
<details id="history-details" class="history-details" hidden><summary id="history-detail-toggle">ผลตรวจทั้งหมด</summary><ol id="history-detail-rows"></ol></details>
</div></dialog>
<p id="notice" role="status" aria-live="polite"></p>
</div></main>

</body></html>
