<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการเติมน้ำยา</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: "Anuphan", sans-serif !important; }
        body { background-color: #f0f3f6; }
        .text-danger { color: #dc3545 !important; }
    </style>
</head>
<body>

    <div class="container pb-5 pt-3">
        <div class="main-card bg-white p-4 rounded shadow-sm mx-auto" style="max-width: 600px;">
            
            <!-- ส่วน Header โลโก้แบบหน้าแรก -->
            <div class="text-center mb-4">
                <img src="logo.png" alt="Logo" style="max-height: 60px;" class="mb-3">
                <hr style="border-top: 2px dashed #ddd; margin: 20px 0;">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h6 class="fw-bold mb-0">บันทึกการเติมน้ำยา</h6>
                <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" id="btn-back">
                    ย้อนกลับ
                </button>
            </div>

            <form id="refill-form">
                <div class="mb-4">
                    <label class="form-label fw-bold">หมายเลขครุภัณฑ์ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control py-2 bg-light" id="assetCode" readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">เลขที่ถัง (ประจำสถานที่)</label>
                    <input type="text" class="form-control py-2 bg-light" id="extId" readonly>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">วันที่ดำเนินการเติม <span class="text-danger">*</span></label>
                    <input type="date" class="form-control py-2" id="refillDate" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">วันหมดอายุ <span class="text-danger">*</span></label>
                    <input type="date" class="form-control py-2" id="expiryDate" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">ชนิดสารเคมี <span class="text-danger">*</span></label>
                    <select class="form-select py-2" id="chemType" required>
                        <option value="" disabled selected>-- เลือกชนิดสารเคมี --</option>
                        <option value="ผงเคมีแห้ง">ผงเคมีแห้ง (Dry Chemical)</option>
                        <option value="คาร์บอนไดออกไซด์">คาร์บอนไดออกไซด์ (CO2)</option>
                        <option value="น้ำยาเหลวระเหย">น้ำยาเหลวระเหย (Halotron)</option>
                        <option value="โฟม">โฟม (Foam)</option>
                        <option value="น้ำ">น้ำ (Water)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">น้ำหนักก่อนเติม (กก.) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control py-2" id="weightBefore" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">น้ำหนักหลังเติม (กก.) <span class="text-danger">*</span></label>
                    <input type="number" step="0.01" class="form-control py-2" id="weightAfter" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">บริษัทที่เติม <span class="text-danger">*</span></label>
                    <input type="text" class="form-control py-2" id="company" required>
                </div>

                <h6 class="fw-bold mb-3 mt-4 pb-2" style="color: #2b4c65; border-bottom: 2px dashed #ddd;">เอกสารแนบ (ถ้ามี)</h6>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #0d6efd;">เอกสารทดสอบแรงดัน</label>
                    <input type="file" class="form-control py-2" id="pressureTestDoc" accept=".pdf,image/*">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold" style="color: #0d6efd;">แนบใบ PO</label>
                    <input type="file" class="form-control py-2" id="poDoc" accept=".pdf,image/*">
                </div>

                <div class="mb-4 mt-4">
                    <label class="form-label fw-bold">หมายเหตุ</label>
                    <textarea class="form-control py-2" id="remark" rows="3" placeholder="ระบุหมายเหตุเพิ่มเติม..."></textarea>
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold shadow-sm mt-3" style="background-color: #2b4c65; color: white; border-radius: 8px; font-size: 1.1rem;">
                    บันทึกข้อมูลการเติมน้ำยา
                </button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // ดึงพารามิเตอร์จาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const deptKey = urlParams.get('dept') || 'traffic';
        const assetCodeParam = urlParams.get('assetCode') || '';
        const extIdParam = urlParams.get('extId') || '';

        // เพิ่มการแปลงรหัสเป็นชื่อหน่วยงานภาษาไทยให้ตรงกับชีท
        const DEPT_MAP = {
            'traffic': 'งานจราจรและความปลอดภัย',
            'salaya': 'อาคารศาลายา กองกายภาพฯ',
            'mlc': 'ศูนย์การเรียนรู้มหิดล',
            'sitthakarn': 'มหิดลสิทธาคาร',
            'siriwittaya': 'อาคารสิริวิทยา',
            'substation': 'สถานีไฟฟ้าย่อยมหิดล',
            'wastewater': 'อาคารบำบัดน้ำเสีย'
        };
        const deptName = DEPT_MAP[deptKey] || 'งานจราจรและความปลอดภัย';

        // ตั้งค่าฟิลด์ให้อ่านอย่างเดียว
        document.getElementById('assetCode').value = assetCodeParam;
        document.getElementById('extId').value = extIdParam;

        // ตั้งค่าวันที่เริ่มต้น (วันนี้) และวันหมดอายุ (อีก 5 ปี)
        const today = new Date();
        document.getElementById('refillDate').valueAsDate = today;
        const expiry = new Date();
        expiry.setFullYear(today.getFullYear() + 5);
        document.getElementById('expiryDate').valueAsDate = expiry;

        // ปุ่มย้อนกลับ
        document.getElementById('btn-back').onclick = () => {
            window.location.href = `list.html?dept=${deptKey}`;
        };

        // แปลงไฟล์เป็น Base64
        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = error => reject(error);
            });
        }

        // จัดการเมื่อกดปุ่มบันทึกฟอร์ม
        document.getElementById('refill-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'กำลังบันทึกข้อมูล...';
            submitBtn.disabled = true;

            try {
                // ดึงไฟล์
                const file1 = document.getElementById('pressureTestDoc').files[0];
                const file2 = document.getElementById('poDoc').files[0];
                const base64Doc1 = await getBase64(file1);
                const base64Doc2 = await getBase64(file2);

                // 🚨 แก้ไข Payload ตรงนี้ ให้ชื่อตัวแปรตรงกับที่ Apps Script ต้องการ 🚨
                const payload = {
                    action: "refill_chemical", // เปลี่ยนให้ตรงกับ Apps Script
                    department: deptName, // ส่งชื่อหน่วยงานภาษาไทย
                    assetCode: document.getElementById('assetCode').value,
                    extId: document.getElementById('extId').value,
                    refillDate: document.getElementById('refillDate').value,
                    nextDueDate: document.getElementById('expiryDate').value, // เปลี่ยนจาก expiryDate เป็น nextDueDate
                    chemicalType: document.getElementById('chemType').value, // เปลี่ยนจาก chemType เป็น chemicalType
                    weightBefore: document.getElementById('weightBefore').value,
                    weightAfter: document.getElementById('weightAfter').value,
                    refillBy: document.getElementById('company').value, // เปลี่ยนจาก company เป็น refillBy
                    note: document.getElementById('remark').value, // เปลี่ยนจาก remark เป็น note
                    
                    hydroBase64: base64Doc1, 
                    hydroName: file1 ? file1.name : "",
                    hydroMime: file1 ? file1.type : "",
                    
                    poBase64: base64Doc2, 
                    poName: file2 ? file2.name : "",
                    poMime: file2 ? file2.type : ""
                };

                // ยิงข้อมูลแบบ Fire and Forget (ไม่รอคำตอบกลับ)
                fetch(CONFIG.GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                // เด้ง Popup ทันทีโดยไม่ต้องรอ
                Swal.fire({
                    icon: 'success',
                    title: 'ส่งข้อมูลเรียบร้อย',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = `list.html?dept=${deptKey}`; 
                });

            } catch (error) {
                alert("❌ เกิดข้อผิดพลาด: " + error.message);
                console.error(error);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
