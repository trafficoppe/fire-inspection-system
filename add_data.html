
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ขึ้นทะเบียนถังดับเพลิงใหม่</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: "Anuphan", sans-serif !important; }
        body { background-color: #f0f3f6; }
        .text-danger { color: #dc3545 !important; }
    </style>
</head>
<body>

    <div class="container pb-5 pt-3">
        <div class="main-card bg-white p-4 rounded shadow-sm mx-auto" style="max-width: 600px;">
            
            <!-- ส่วน Header โลโก้แบบหน้าแรก -->
            <div class="text-center mb-4">
                <img src="logo.png" alt="Logo" style="max-height: 60px;" class="mb-3">
                <hr style="border-top: 2px dashed #ddd; margin: 20px 0;">
            </div>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h6 class="fw-bold mb-0">เพิ่มข้อมูลถังดับเพลิง</h6>
                <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-pill" id="btn-back">
                    ย้อนกลับ
                </button>
            </div>

            <form id="add-extinguisher-form">
                <div class="mb-4">
                    <label class="form-label fw-bold">ชนิด <span class="text-danger">*</span></label>
                    <select class="form-select py-2" id="type" required>
                        <option value="" disabled selected>เลือกชนิดถังดับเพลิง</option>
                        <option value="ผงเคมีแห้ง (Dry Chemical)">ผงเคมีแห้ง (Dry Chemical)</option>
                        <option value="คาร์บอนไดออกไซด์ (CO2)">คาร์บอนไดออกไซด์ (CO2)</option>
                        <option value="น้ำยาเหลวระเหย (Halotron)">น้ำยาเหลวระเหย (Halotron)</option>
                        <option value="โฟม (Foam)">โฟม (Foam)</option>
                        <option value="น้ำ (Water)">น้ำ (Water)</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">ขนาด (ปอนด์) <span class="text-danger">*</span></label>
                    <select class="form-select py-2" id="size" required>
                        <option value="" disabled selected>เลือกขนาด (ปอนด์)</option>
                        <option value="10">10</option>
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">เลขที่ถัง <span class="text-danger">*</span></label>
                    <input type="text" class="form-control py-2" id="extId" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">หมายเลขครุภัณฑ์ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control py-2" id="assetCode" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">สถานที่ติดตั้ง <span class="text-danger">*</span></label>
                    <input type="text" class="form-control py-2" id="location" required>
                </div>

                <div class="mb-5">
                    <label class="form-label fw-bold">ปีที่ซื้อ <span class="text-danger">*</span></label>
                    <input type="number" class="form-control py-2" id="year" required>
                </div>

                <h6 class="fw-bold mb-3 pb-2" style="color: #dc3545; border-bottom: 2px dashed #ddd;">อัปโหลดรูปภาพ</h6>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">1. รูปตัวถัง <span class="text-danger">*</span></label>
                    <input type="file" class="form-control py-2" id="img1" accept="image/*" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">2. รูปหมายเลขครุภัณฑ์ <span class="text-danger">*</span></label>
                    <input type="file" class="form-control py-2" id="img2" accept="image/*" required>
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold shadow-sm mt-3" style="background-color: #2b4c65; color: white; border-radius: 8px; font-size: 1.1rem;">
                    บันทึกข้อมูลเข้าระบบ
                </button>
            </form>
        </div>
    </div>

    <!-- ใส่ Script เดิมของคุณไว้ที่นี่ -->
    <script src="config.js"></script>
    <script>
        // ใช้ Script เดิมของคุณได้เลยครับ
        const urlParams = new URLSearchParams(window.location.search);
        const deptKey = urlParams.get('dept') || 'traffic';
        
        const DEPT_MAP = {
            'traffic': 'งานจราจรและความปลอดภัย',
            'salaya': 'อาคารศาลายา กองกายภาพฯ',
            'mlc': 'ศูนย์การเรียนรู้มหิดล',
            'sitthakarn': 'มหิดลสิทธาคาร',
            'siriwittaya': 'อาคารสิริวิทยา',
            'substation': 'สถานีไฟฟ้าย่อยมหิดล',
            'wastewater': 'อาคารบำบัดน้ำเสีย'
        };
        const DEPT_NAME = DEPT_MAP[deptKey] || 'งานจราจรและความปลอดภัย';

        document.getElementById('btn-back').onclick = () => { window.location.href = `list.html?dept=${deptKey}`; };

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) { resolve(""); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]); 
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('add-extinguisher-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = 'กำลังบันทึกและอัปโหลดรูป...';
            submitBtn.disabled = true;

            try {
                const file1 = document.getElementById('img1').files[0];
                const file2 = document.getElementById('img2').files[0];
                const base64Img1 = await getBase64(file1);
                const base64Img2 = await getBase64(file2);

                const payload = {
                    action: "add_extinguisher", department: DEPT_NAME, 
                    type: document.getElementById('type').value, size: document.getElementById('size').value,
                    location: document.getElementById('location').value, extId: document.getElementById('extId').value,
                    assetCode: document.getElementById('assetCode').value, year: document.getElementById('year').value,
                    img1_base64: base64Img1, img2_base64: base64Img2,
                    img1_name: file1 ? file1.name : "", img2_name: file2 ? file2.name : ""
                };

                // ยิงข้อมูลแบบ Fire and Forget (ไม่รอคำตอบกลับ)
                fetch(CONFIG.GAS_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                
                // เด้ง Popup ทันทีโดยไม่ต้องรอ
                Swal.fire({
                    icon: 'success',
                    title: 'เพิ่มข้อมูลเรียบร้อย',
                    showConfirmButton: false,
                    timer: 1500
                }).then(() => {
                    window.location.href = `list.html?dept=${deptKey}`; 
                });

            } catch (error) {
                alert("❌ เกิดข้อผิดพลาด: " + error.message);
                console.error(error);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
